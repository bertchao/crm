const FIREBASE_CONFIG = {

let db = null, useFirebase = false;

function initFirebase() {
  if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === "YOUR_API_KEY") return;
  const s1 = document.createElement("script");
  s1.src = "https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js";
  s1.onload = () => {
    const s2 = document.createElement("script");
    s2.src = "https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js";
    s2.onload = () => {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      useFirebase = true;
      db.ref("crm/calls").on("value", snap => { const v=snap.val(); if(v){S.calls=v; if(!S.modal)render();} });
      db.ref("crm/rules").on("value", snap => { const v=snap.val(); if(v){S.rules=v; if(!S.modal)render();} });
      loadData();
    };
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
}

async function dbGet(k) {
  if (useFirebase && db) { const s=await db.ref("crm/"+k).get(); return s.exists()?s.val():null; }
  const v = localStorage.getItem("crm:"+k);
  return v ? JSON.parse(v) : null;
}
async function dbSet(k, v) {
  if (useFirebase && db) { await db.ref("crm/"+k).set(v); return; }
  localStorage.setItem("crm:"+k, JSON.stringify(v));
}

// ── 登入系統設定（Google Identity Services） ─────────────────────────

async function loadData() {

  if (cl) S.calls = cl;
  if (r) S.rules = r;
  if (pids && Array.isArray(pids)) S.importedPayIds = new Set(pids);
  if (sl && Array.isArray(sl) && sl.length > 0) S.staffList = sl;
  STAFF = S.staffList;
  if (S.custs.length > 0 && S.tab === "import") S.tab = "clients";

async function saveStaffList() { await dbSet("staffList", S.staffList); STAFF = S.staffList; }

// ── Google Identity Services 登入 ────────────────────────────────────
function parseJwtPayload(token) {
  try {
    const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
    ).join(''));
    return JSON.parse(json);
  } catch (e) { return null; }
}

function isSessionValid() {
  const authed = sessionStorage.getItem('crm_authed');
  const exp = parseInt(sessionStorage.getItem('crm_token_exp') || '0', 10);
  const email = (sessionStorage.getItem('crm_email') || '').toLowerCase();
  const now = Math.floor(Date.now() / 1000);
  return authed === 'google-oauth' && exp > now && email.endsWith('@' + ALLOWED_DOMAIN);
}

function restoreSession() {
  if (!isSessionValid()) { sessionStorage.clear(); return false; }
  S.email = (sessionStorage.getItem('crm_email')||'').toLowerCase();
  S.user = sessionStorage.getItem('crm_name') || S.email.split('@')[0];
  S.picture = sessionStorage.getItem('crm_picture') || '';
  S.userRole = ADMIN_EMAILS.includes(S.email) ? 'admin' : 'staff';
  S.setup = true;
  return true;
}

window.handleCredentialResponse = function(response) {
  const idToken = response && response.credential;
  if (!idToken) { S.authError = '登入失敗：未取得 Google 憑證'; render(); return; }
  const payload = parseJwtPayload(idToken);
  if (!payload) { S.authError = '登入失敗：無法解析憑證'; render(); return; }
  const now = Math.floor(Date.now() / 1000);
  if (!payload.exp || payload.exp < now) { S.authError = '登入失敗：憑證已過期'; render(); return; }
  if (payload.iss !== 'https://accounts.google.com' && payload.iss !== 'accounts.google.com') {
    S.authError = '登入失敗：憑證簽發者不正確'; render(); return;
  }
  if (payload.aud !== CLIENT_ID) { S.authError = '登入失敗：憑證接收者不正確'; render(); return; }
  if (payload.hd !== ALLOWED_DOMAIN || !payload.email || !payload.email.toLowerCase().endsWith('@' + ALLOWED_DOMAIN)) {
    S.authError = '此系統僅限 @' + ALLOWED_DOMAIN + ' 網域帳號'; render(); return;
  }
  // 通過
  sessionStorage.setItem('crm_authed', 'google-oauth');
  sessionStorage.setItem('crm_id_token', idToken);
  sessionStorage.setItem('crm_email', payload.email);
  sessionStorage.setItem('crm_name', payload.name || payload.email);
  sessionStorage.setItem('crm_picture', payload.picture || '');
  sessionStorage.setItem('crm_token_exp', String(payload.exp));
  S.email = payload.email.toLowerCase();
  S.user = payload.name || S.email.split('@')[0];
  S.picture = payload.picture || '';
  S.userRole = ADMIN_EMAILS.includes(S.email) ? 'admin' : 'staff';
  S.authError = '';
  S.setup = true;
  loadData();
  render();
};

function logout() {
  sessionStorage.clear();
  S.email = ''; S.user = ''; S.picture = ''; S.userRole = '';
  S.setup = false; S.authError = '';
  if (window.google?.accounts?.id?.disableAutoSelect) {

}

function fmtD(s) {
  if (!s) return "—";
  s = String(s).replace(/-/g,"");
  if (s.length<8) return s;
  return s.slice(0,4)+"/"+s.slice(4,6)+"/"+s.slice(6,8);
}

// ── 讀取單一檔案為 rows ─────────────────────────────────────────────
function readFileToRows(file) {
  return new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onload = e => {
      try {
        let rows=[], hdrs=[];
        if (file.name.toLowerCase().endsWith(".csv")) {
          const txt = new TextDecoder("utf-8").decode(new Uint8Array(e.target.result));
          const lines = txt.split(/\r?\n/).filter(l=>l.trim());
          hdrs = lines[0].split(",").map(h=>h.trim().replace(/^"|"$/g,""));
          rows = lines.slice(1).map(l => {
            const v = l.split(",").map(x=>x.trim().replace(/^"|"$/g,""));
            const o={}; hdrs.forEach((h,i)=>o[h]=v[i]||""); return o;
          });
          resolve({rows, hdrs, storeFormat: false});
        } else {
          const wb = XLSX.read(e.target.result, {type:"array"});
          // ★ 門市格式偵測：含「明細」工作表且有「單據號碼」欄位
          const isStore = wb.SheetNames.includes("明細") &&
            (() => {
              const ws = wb.Sheets["明細"];
              const r = XLSX.utils.sheet_to_json(ws, {defval:"", header:1});
              return r[0] && r[0].includes("單據號碼");
            })();

          if (isStore) {
            // 門市格式：讀「明細」工作表
            const ws = wb.Sheets["明細"];
            rows = XLSX.utils.sheet_to_json(ws, {defval:""});
            hdrs = rows.length>0 ? Object.keys(rows[0]) : [];
            resolve({rows, hdrs, storeFormat: true});
          } else {
            const ws = wb.Sheets[wb.SheetNames[0]];
            rows = XLSX.utils.sheet_to_json(ws, {defval:""});
            hdrs = rows.length>0 ? Object.keys(rows[0]) : [];
            // POS／經銷對帳匯出：單一工作表、無「單據號碼」，但有「建檔時間」＋「客戶代號」
            const posFormat = hdrs.some(x=>x.includes("建檔時間")) && hdrs.some(x=>x.includes("客戶代號"));
            resolve({rows, hdrs, storeFormat: false, posFormat});
          }
        }
      } catch(err) { reject(err); }
    };
    rd.onerror = () => reject(new Error("讀取失敗"));
    rd.readAsArrayBuffer(file);
  });
}

// 日期正規化 → 一律回 YYYYMMDD（8 碼）或 ""
// 支援：民國 114.09.08 / 西元 2026-04-22 / 2026/8/1 下午 01:05:27 / 20260422 / Date 物件 / Excel 序列值
function normDate(s) {
  if (s === null || s === undefined || s === "") return "";
  const pad = n => String(n).padStart(2, "0");
  if (s instanceof Date && !isNaN(s)) return `${s.getFullYear()}${pad(s.getMonth()+1)}${pad(s.getDate())}`;
  if (typeof s === "number" && s > 20000 && s < 80000) {          // Excel 日期序列值
    const d = new Date(Date.UTC(1899,11,30) + Math.floor(s)*86400000);
    return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}`;
  }
  const str  = String(s).trim();
  const head = str.split(/[\sT]/)[0];                             // 切掉時間與上午/下午
  let m = head.match(/^(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})$/);  // 西元 2026/8/1
  if (m) return `${m[1]}${pad(m[2])}${pad(m[3])}`;
  m = head.match(/^(\d{2,3})[.\-/](\d{1,2})[.\-/](\d{1,2})$/);    // 民國 114.09.08
  if (m) return `${parseInt(m[1],10)+1911}${pad(m[2])}${pad(m[3])}`;
  if (/^\d{8,}$/.test(head)) return head.slice(0,8);              // 20260422
  return "";
}

// 民國日期轉西元（114.09.08 → 20250908）— 保留舊名，統一走 normDate
function rocToAD(s) { return normDate(s); }

// 門市資料專用解析：rows 來自「明細」工作表
function storeRowsToCustMap(rows, sourceLabel) {
  const src = sourceLabel || "門市";
  const custMap = {};
  rows.forEach(r => {
    const custId = String(r["客戶代號"]||"").trim().toUpperCase();
    const name   = String(r["簡稱"]||"").trim();
    if (!name && !custId) return;
    const key = custId || name;

    if (!custMap[key]) custMap[key] = {
      name, phone: custId,
      fb:"", source:src, address:"",
      payIds: new Set(),
      orderIds: new Set(),
      totalAmt: 0,
      firstDate:"", lastDate:"",
      payments: {},
    };
    const cc = custMap[key];
    if (!cc.name && name) cc.name = name;

    const payId    = String(r["單據號碼"]||"").trim();
    const rowAmt   = parseFloat(r["小計"])||0;
    const rowDate  = rocToAD(r["日期"]);
    const goodsName= String(r["產品名稱"]||"").trim();
    const qty      = parseInt(r["數量"])||1;
    const unitPrice= parseFloat(r["單價"])||0;
    const unitType = String(r["單據型態"]||"").trim();

    // 只計「P 銷」（排除退貨等）
    if (unitType && !unitType.includes("銷")) return;

    if (payId) {
      if (S.importedPayIds.has(payId)) return; // 防呆

      if (!cc.payIds.has(payId)) {
        cc.payIds.add(payId);
        cc.totalAmt += rowAmt;
        cc.payments[payId] = { date:rowDate, amount:0, address:"", items:[], src };
      }
      cc.payments[payId].amount += rowAmt;
      if (goodsName) cc.payments[payId].items.push({name:goodsName, qty, unitPrice, amount:rowAmt});
    } else {
      cc.totalAmt += rowAmt;
    }

    const d  = rowDate;
    if (d && (!cc.lastDate ||d >cc.lastDate )) cc.lastDate  = d;
    if (d && (!cc.firstDate||d<cc.firstDate )) cc.firstDate = d;
  });
  return { custMap, skippedPayIds: 0 };
}

// ── 自動猜測欄位 ────────────────────────────────────────────────────
function autoDetectFields(hdrs) {
  const auto = {
    name:["收件人","姓名","客戶姓名","客戶名稱","買家姓名","name"],
    phone:["聯絡電話","行動電話","電話","手機","phone"],
    amount:["總金額","消費金額","金額","實際銷售小計","銷售小計","小計","amount","消費總額"],
    payments:["付款單號","付款單數","單據號碼","payments"],
    orders:["訂單編號","訂單數","orders"],
    source:["入單來源","來源","source"],
    lastDate:["下單日期","最後消費日","建檔時間","交易時間","銷售日期","消費日期","日期","lastDate"],
    firstDate:["首次消費日","firstDate"],
    fb:["FB帳號","FB","facebook","買家名稱","社群帳號","fb帳號","臉書"],
    goodsName:["商品名稱","產品名稱","商品","品名","goodsName","product"],
    qty:["數量","實際數量","qty","quantity"],
    unitPrice:["單價","實際銷貨價","銷貨價","unitPrice","price"],
    address:["寄送地址","地址","收件地址","address"],
  };
  const mp = {};
  Object.entries(auto).forEach(([f,cs]) => {
    const h = cs.find(c => hdrs.some(x=>x.includes(c)));
    mp[f] = h ? hdrs.find(x=>x.includes(h))||"" : "";
  });
  return mp;
}

// ── 把 rows 彙整成客戶 Map ─────────────────────────────────────────
function rowsToCustMap(rows, fm, sourceLabel) {
  const src = sourceLabel || "直播";
  // POS／門市匯出裡代表「無記名現場交易」的匯總戶，不是真實客戶 → 不建檔
  const AGGREGATE_NAMES = ["POS門市","現場客","一般客戶","散客","現場銷售"];
  const custMap = {};
  let skippedPayIds = 0;  // 因全域去重跳過的付款單數

  rows.forEach(r => {
    const name  = String(r[fm.name]||"").trim();
    const phone = String(r[fm.phone]||"").trim();
    if (!name && !phone) return;
    if (!phone && AGGREGATE_NAMES.includes(name)) return;
    const key = phone || name;
    if (!custMap[key]) custMap[key] = {
      name, phone,
      fb: String(r[fm.fb]||""),
      source: src,
      address: "",
      payIds: new Set(),
      orderIds: new Set(),
      totalAmt: 0,
      firstDate:"", lastDate:"",
      payments: {},
    };
    const cc = custMap[key];
    const rowAddress = fm.address && r[fm.address] ? String(r[fm.address]).trim() : "";
    let   payId    = String(r[fm.payments]||"").trim();
    const orderId  = String(r[fm.orders]||"").trim();
    const rowAmt   = parseFloat(r[fm.amount])||0;
    const rawDate  = fm.lastDate ? r[fm.lastDate] : "";
    const rowDate  = normDate(rawDate);
    // 來源沒有單據號碼時（例如 POS 匯出）：用「日期＋時間＋客戶」合成去重鍵。
    // 同一次交易的多項商品會落在同一組付款單；同一份檔重複匯入也不會重複累加金額。
    if ((!payId || payId.length <= 3) && rowDate) {
      const rawStr = String(rawDate);
      const ap     = /下午|PM/i.test(rawStr) ? "P" : "A";
      const tdig   = (rawStr.match(/\d+/g) || []).join("").slice(-6);
      payId = `POS${rowDate}-${ap}${tdig}-${phone || name}`;
    }
    const goodsName= fm.goodsName ? String(r[fm.goodsName]||"").trim() : "";
    const qty      = fm.qty ? parseInt(r[fm.qty])||1 : 1;
    const unitPrice= fm.unitPrice ? parseFloat(r[fm.unitPrice])||0 : 0;

    if (payId && payId.length > 3) {
      // ★ 防呆：此付款單號已在歷次匯入中存在 → 跳過
      if (S.importedPayIds.has(payId)) {
        skippedPayIds++;
        // 仍允許補入商品明細（不重複計金額）
        if (cc.payments[payId] && goodsName) {
          // 避免同一商品重複加入
          const alreadyHas = cc.payments[payId].items.some(i => i.name===goodsName && i.qty===qty);
          if (!alreadyHas) cc.payments[payId].items.push({ name:goodsName, qty, unitPrice, amount:rowAmt });
        }
        return;
      }

      if (!cc.payIds.has(payId)) {
        // 付款單第一次出現：建立記錄，amount 先設 0，後面逐筆累加
        cc.payIds.add(payId);
        cc.payments[payId] = { date:rowDate, amount:0, address:rowAddress, items:[], src };
      }

      // ★ 每一筆商品金額都累加到付款單總額 和 客戶總額
      cc.payments[payId].amount += rowAmt;
      cc.totalAmt += rowAmt;

      // 補地址
      if (rowAddress && !cc.payments[payId].address) {
        cc.payments[payId].address = rowAddress;
      }
      // 加入商品明細
      if (goodsName) {
        cc.payments[payId].items.push({ name:goodsName, qty, unitPrice, amount:rowAmt });
      }
    } else {
      if (orderId && cc.orderIds.has(orderId)) {}
      else {
        if (orderId) cc.orderIds.add(orderId);
        cc.totalAmt += rowAmt;
        const fakeKey = orderId || ("ord-"+Object.keys(cc.payments).length);
        if (!cc.payments[fakeKey]) cc.payments[fakeKey] = { date:rowDate, amount:0, address:rowAddress, items:[], src };
        cc.payments[fakeKey].amount += rowAmt;
        if (goodsName) cc.payments[fakeKey].items.push({ name:goodsName, qty, unitPrice, amount:rowAmt });
      }
    }
    if (orderId) cc.orderIds.add(orderId);

    const d  = rowDate;
    const fd = normDate(r[fm.firstDate] || rawDate);
    if (d  && (!cc.lastDate ||d >cc.lastDate )) cc.lastDate  = d;
    if (fd && (!cc.firstDate||fd<cc.firstDate)) cc.firstDate = fd;
    if (!cc.fb && r[fm.fb]) cc.fb = String(r[fm.fb]);
    if (rowAddress) cc.address = rowAddress;
  });
  return { custMap, skippedPayIds };
}

// ── 來源以「付款明細」為準回推，而不是以最後一次匯入的批次標籤為準 ──────
//   同一位客戶可能 46 筆線上 + 2 筆門市，只因為最後匯的是門市檔就整個被標成
//   「門市」是錯的。這裡逐筆看明細出自哪一種來源，再依筆數多寡組標籤。
const ONLINE_LEGACY = ["直播","FB","IG","LINE"];
function inferSource(payDetails, fallback) {
  const base = ONLINE_LEGACY.includes(fallback) ? fallback : "直播";
  const cnt = {};
  Object.entries(payDetails || {}).forEach(([pid, pd]) => {
    let s = (pd && pd.src) || "";
    if (!s) {
      // 舊資料沒記來源 → 從付款單號格式回推
      if (/^POS\d{8}-/.test(pid) || /^1\d{10}$/.test(pid)) s = "門市";   // POS 合成鍵／民國單據號
      else if (/^PA/i.test(pid)) s = base;                                // 電商／直播訂單號
    }
    if (s) cnt[s] = (cnt[s] || 0) + 1;
  });
  // 固定排序（線上在前、門市在後），同一種組合永遠只會有一個標籤，篩選才不會被拆散
  const ORDER = ["直播","FB","IG","LINE","門市"];
  const rank = s => { const i = ORDER.indexOf(s); return i < 0 ? ORDER.length : i; };
  const list = Object.keys(cnt).sort((a,b) => rank(a) - rank(b) || a.localeCompare(b));
  if (!list.length) return fallback || "";
  return list.length <= 3 ? list.join("+") : "多管道";
}

// ── 核心：合併一個 custMap 進 S.custs，同時更新全域已匯入付款單號 ──
function mergeCustMap(custMap) {
  const phoneMap = {};
  S.custs.forEach(c => { if(c.phone) phoneMap[c.phone] = c; });
  let merged=0, added=0;
  Object.values(custMap).forEach(nc => {
    const newPayDetails = nc.payments;

    // ★ 把本次新付款單號加入全域 Set
    nc.payIds.forEach(pid => S.importedPayIds.add(pid));

    if (nc.phone && phoneMap[nc.phone]) {
      const ex = phoneMap[nc.phone];

      // 合併 payDetails（以付款單號為 key，不覆蓋已有的）
      if (!ex.payDetails) ex.payDetails = {};

      // ★ 自我修復：清掉舊版失敗匯入留下的空殼明細（ord-N、金額 0、無日期）
      //   成因是欄位沒對應到 → 金額與日期讀成空，留著只會灌水付款筆數
      Object.keys(ex.payDetails).forEach(pid => {
        const pd = ex.payDetails[pid] || {};
        if (pid.startsWith("ord-") && !(pd.amount > 0) && !pd.date) delete ex.payDetails[pid];
      });

      Object.entries(newPayDetails).forEach(([pid, pd]) => {
        if (!ex.payDetails[pid]) ex.payDetails[pid] = pd;
      });

      // ★ 自我修復：舊記錄姓名空白時用新資料補回
      if (!String(ex.name||"").trim() && nc.name) ex.name = nc.name;

      // ★ 重算：以 payDetails 為唯一真相，重新計算 amount 和 payments
      const pidList = Object.keys(ex.payDetails);
      ex.amount   = pidList.reduce((s, pid) => s + (ex.payDetails[pid].amount||0), 0);
      ex.payments = pidList.length;
      ex.orders   = Math.max(pidList.reduce((s,pid)=>s+((ex.payDetails[pid].items||[]).length||1),0), pidList.length);

      // 更新日期
      if (nc.lastDate  && (!ex.lastDate ||nc.lastDate >ex.lastDate )) ex.lastDate  = nc.lastDate;
      if (nc.firstDate && (!ex.firstDate||nc.firstDate<ex.firstDate)) ex.firstDate = nc.firstDate;

      // 補充資料
      if (!ex.fb && nc.fb) ex.fb = nc.fb;
      if (nc.fb) ex.fb = nc.fb; // 有新 fb 就更新
      if (!ex.address && nc.address) ex.address = nc.address;
      // 來源一律從付款明細重算（拿舊標籤當線上來源的判讀依據）
      ex.source = inferSource(ex.payDetails, ex.source) || nc.source || ex.source;
      merged++;
    } else {
      // 新客戶：直接用 payDetails 計算正確的 amount 和 payments
      const pidList = Object.keys(newPayDetails);
      const correctAmount   = pidList.reduce((s, pid) => s + (newPayDetails[pid].amount||0), 0);
      const correctPayments = pidList.length || nc.payIds.size || 1;

      const newC = {
        id: "i"+Date.now()+Math.random().toString(36).slice(2,6),
        name:nc.name, phone:nc.phone, fb:nc.fb,
        amount:correctAmount,
        payments:correctPayments,
        orders: Math.max(pidList.reduce((s,pid)=>(newPayDetails[pid].items||[]).length?s+(newPayDetails[pid].items.length):s+1, 0), correctPayments),
        source: inferSource(newPayDetails, nc.source) || nc.source,
        lastDate:nc.lastDate, firstDate:nc.firstDate,
        address:nc.address||"",
        payDetails: newPayDetails,
      };
      S.custs.push(newC);
      if (nc.phone) phoneMap[nc.phone] = newC;
      added++;
    }
  });
  return {merged, added};
}

// ── 加入檔案到佇列 ─────────────────────────────────────────────────
function addFilesToQueue(files) {
  const validExts = [".xlsx",".xls",".csv"];
  Array.from(files).forEach(file => {
    const ext = file.name.toLowerCase().slice(file.name.lastIndexOf("."));
    if (!validExts.includes(ext)) return;
    // 避免重複加入同名檔案
    if (S.fileQueue.some(f => f.name===file.name)) return;
    S.fileQueue.push({ file, name:file.name, status:"pending", rows:[], hdrs:[], result:null });
  });
  if (S.fileQueue.length > 0 && S.batchStep === 0) {
    // 讀取第一個檔案的 headers 來做欄位對應
    readFirstHeaders();
  }
}

async function readFirstHeaders() {
  const first = S.fileQueue[0];
  try {
    const {hdrs, storeFormat, posFormat} = await readFileToRows(first.file);
    if (storeFormat) {
      first.detectedFormat = "門市";
      S.batchStep = 1;
      S.hdrs = [];
      S.storeFormatDetected = true;
      S.importSource = "門市";    // 自動偵測 → 預設門市
    } else {
      S.hdrs = hdrs;
      S.fm = autoDetectFields(hdrs);
      S.storeFormatDetected = false;
      S.batchStep = 1;
      // POS 匯出 → 預設門市；其餘一般格式 → 預設直播
      S.importSource = posFormat ? "門市" : "直播";
      if (posFormat) first.detectedFormat = "門市 POS";
    }
    render();
  } catch(e) {
    first.status = "error";
    first.result = e.message;
    render();
  }
}

// ── 批次執行所有檔案匯入 ───────────────────────────────────────────
async function runBatchImport() {
  S.batchStep = 2;
  render();

  let totalMerged=0, totalAdded=0, totalSkipped=0;

  for (let i=0; i<S.fileQueue.length; i++) {
    const item = S.fileQueue[i];
    item.status = "processing";
    render();
    try {
      const {rows, hdrs, storeFormat} = await readFileToRows(item.file);
      let custMap, skippedPayIds;
      if (storeFormat) {
        // 門市格式：專用解析
        item.detectedFormat = S.importSource;
        ({custMap, skippedPayIds} = storeRowsToCustMap(rows, S.importSource));
      } else {
        // 一般格式（直播或使用者指定的來源）
        item.detectedFormat = S.importSource;
        if (item === S.fileQueue[0]) {
          // 只在第一個檔案偵測欄位
          const auto = autoDetectFields(hdrs);
          S.fm = auto; S.hdrs = hdrs;
        }
        ({custMap, skippedPayIds} = rowsToCustMap(rows, S.fm, S.importSource));
      }
      const {merged, added} = mergeCustMap(custMap);
      item.status = "done";
      item.skipped = skippedPayIds;
      item.result = `[${item.detectedFormat}] 新增 ${added} 位，更新 ${merged} 位${skippedPayIds>0?`，略過 ${skippedPayIds} 筆重複`:""}`;
      totalMerged  += merged;
      totalAdded   += added;
      totalSkipped += skippedPayIds;
    } catch(e) {
      item.status = "error";
      item.result = e.message;
    }
    render();
    await new Promise(r => setTimeout(r, 80));
  }

  // 儲存客戶資料 + 全域已匯入付款單號
  await Promise.all([savCustomers(), saveImportedPayIds()]);
  S.batchStats = { merged:totalMerged, added:totalAdded, total:S.custs.length, files:S.fileQueue.length, skipped:totalSkipped };
  S.batchStep = 3;
  render();
}

function renderFileQueue() {
  if (!S.fileQueue.length) return "";
  const icons = {pending:"📄", processing:"⏳", done:"✅", error:"❌"};
  const labels = {pending:"等待中", processing:"處理中...", done:"完成", error:"失敗"};
  return `<div class="file-queue">
    ${S.fileQueue.map((f,i)=>`
    <div class="file-item ${f.status}">
      <span class="file-icon">${icons[f.status]||"📄"}</span>
      <span class="file-name">${f.name}</span>
      ${f.result ? `<span style="font-size:12px;color:${f.status==="error"?"#E24B4A":"#3B6D11"};">${f.result}</span>` : ""}
      <span class="file-status ${f.status}">${labels[f.status]||""}</span>
      ${(S.batchStep===0||S.batchStep===1)&&f.status==="pending" ? `<button class="rm-file" data-i="${i}" style="background:none;border:none;cursor:pointer;color:#ccc;font-size:16px;padding:0 2px;">✕</button>` : ""}
    </div>`).join("")}
  </div>`;
}

function sortClients(fl) {
  if (!S.sortCol) return fl;
  return [...fl].sort((a,b) => {
    let va, vb;
    if (S.sortCol==="amount")   { va=a.amount;   vb=b.amount; }
    else if (S.sortCol==="payments") { va=a.payments; vb=b.payments; }
    else if (S.sortCol==="lastDate") { va=a.lastDate||""; vb=b.lastDate||""; }
    else if (S.sortCol==="lastFollowDate") { va=a.lastFollowDate||""; vb=b.lastFollowDate||""; }
    else if (S.sortCol==="name")     { va=a.name; vb=b.name; return S.sortDir*va.localeCompare(vb,"zh-TW"); }
    else if (S.sortCol==="grade")    {
      const o={"VIP":0,"一般":1,"新客":2};
      va=o[a.grade]??1; vb=o[b.grade]??1;
    }
    else return 0;
    return S.sortDir * (va>vb?1:va<vb?-1:0);
  });
}

function thSort(label, col, w) {
  const active = S.sortCol===col;
  const arrow = active ? (S.sortDir===1?"▲":"▼") : "⬍";
  const color = active ? "#185FA5" : "#999";
  return `<th class="sort-th" data-col="${col}" style="width:${w}px;background:#f8f8f8;padding:9px 10px;text-align:left;font-weight:500;font-size:12px;color:${color};border-bottom:1px solid #eee;cursor:pointer;user-select:none;white-space:nowrap;">
    ${label} <span style="font-size:10px;opacity:.7;">${arrow}</span>
  </th>`;
}
function thPlain(label, w) {
  return `<th style="width:${w}px;background:#f8f8f8;padding:9px 10px;text-align:left;font-weight:500;font-size:12px;color:#999;border-bottom:1px solid #eee;">${label}</th>`;
}

// ── 掃描並修復重複付款單 ───────────────────────────────────────────
function scanDuplicates() {
  let mismatch = 0;
  const globalPids = {};

  S.custs.forEach(c => {
    const pds = c.payDetails || {};
    const detailCount = Object.keys(pds).length;

    // 情況1：有 payDetails，檢查是否與 payments/amount 一致
    if (detailCount > 0) {
      const correctAmt = Object.values(pds).reduce((s, p) => s + (p.amount||0), 0);
      if (c.payments !== detailCount || Math.round(c.amount) !== Math.round(correctAmt)) {
        mismatch++;
      }
    }

    // 情況2：付款筆數不合理（超過當月可能購買次數，估計上限50）
    if (!detailCount && c.payments > 50) mismatch++;

    // 情況3：跨客戶重複 payId
    Object.keys(pds).forEach(pid => {
      globalPids[pid] = (globalPids[pid] || 0) + 1;
    });
  });

  const crossDups = Object.entries(globalPids).filter(([,n]) => n > 1).map(([pid]) => pid);
  return { mismatch, crossDups };
}

async function fixDuplicates() {
  let fixedCusts = 0;

  // ── Step A: 跨客戶重複 payId → 保留金額較大者 ──────────────────
  const globalPidMap = {};
  S.custs.forEach((c, ci) => {
    Object.entries(c.payDetails || {}).forEach(([pid, pd]) => {
      if (!globalPidMap[pid]) {
        globalPidMap[pid] = { ci, amount: pd.amount || 0 };
      } else {
        const ex = globalPidMap[pid];
        if ((pd.amount || 0) >= ex.amount) {
          delete S.custs[ex.ci].payDetails[pid];
          globalPidMap[pid] = { ci, amount: pd.amount || 0 };
        } else {
          delete c.payDetails[pid];
        }
      }
    });
  });

  // ── Step B: 每位客戶重算 amount 和 payments ────────────────────
  S.custs.forEach(c => {
    const pds = c.payDetails || {};
    const pidList = Object.keys(pds);

    if (pidList.length > 0) {
      // 有 payDetails → 以明細為唯一真相重算
      const correctAmount   = pidList.reduce((s, pid) => s + (pds[pid].amount || 0), 0);
      const correctPayments = pidList.length;
      const correctOrders   = pidList.reduce((s, pid) => s + ((pds[pid].items||[]).length || 1), 0);

      if (c.payments !== correctPayments || Math.round(c.amount) !== Math.round(correctAmount)) {
        c.amount   = correctAmount;
        c.payments = correctPayments;
        c.orders   = Math.max(correctOrders, correctPayments);
        fixedCusts++;
      }

      // 來源以付款明細為準重算（修掉「最後匯哪批就標成哪個來源」的錯標）
      const inferred = inferSource(pds, c.source);
      if (inferred && inferred !== c.source) { c.source = inferred; fixedCusts++; }

      // 修正 firstDate / lastDate
      const dates = pidList.map(pid => pds[pid].date||"").filter(Boolean).sort();
      if (dates.length > 0) {
        c.firstDate = dates[0];
        c.lastDate  = dates[dates.length - 1];
      }
    } else {
      // 沒有 payDetails（舊資料）→ 無法從明細推算，但可以
      // 偵測 payments 是否是整數倍（重複匯入的典型特徵）
      // 用 GCD 算法猜測最可能的原始筆數
      if (c.payments > 0 && c.amount > 0) {
        const repeats = detectRepeats(c.payments, c.amount);
        if (repeats > 1) {
          c.payments = Math.round(c.payments / repeats);
          c.amount   = Math.round(c.amount   / repeats);
          c.orders   = Math.round((c.orders  || c.payments) / repeats);
          fixedCusts++;
        }
      }
    }
  });

  // ── Step C: 重建 importedPayIds ───────────────────────────────
  const allPids = new Set();
  S.custs.forEach(c => Object.keys(c.payDetails || {}).forEach(pid => allPids.add(pid)));
  S.importedPayIds = allPids;

  await Promise.all([savCustomers(), saveImportedPayIds()]);
  return fixedCusts;
}

// 偵測重複次數：若 payments 能被 2~10 整除且 amount/payments 接近整數，判定為重複
function detectRepeats(payments, amount) {
  for (let r = 10; r >= 2; r--) {
    if (payments % r === 0) {
      const perPay = amount / payments;
      // 每筆付款金額接近整數 = 有可能是重複匯入
      if (Math.abs(perPay - Math.round(perPay)) < 1) {
        return r;
      }
    }
  }
  return 1;
}

          ${mismatch > 0 ? `• <strong>${mismatch}</strong> 位客戶的付款筆數與明細不符（因重複匯入累加）<br>` : ""}
          ${crossDups.length > 0 ? `• <strong>${crossDups.length}</strong> 個付款單號出現在多位客戶<br>` : ""}
        </div>
        <div style="font-size:11px;color:#a06020;margin-bottom:10px;">修復後系統將依付款明細重新計算每位客戶的正確金額和筆數</div>
        <button id="fix-dup-btn" class="pbtn" style="background:#854F0B;font-size:12px;padding:6px 14px;">立即修復重複資料</button>
      </div>` : `
      <div style="padding:10px 14px;background:#F0FFF4;border-radius:10px;border:1px solid #c6f6d5;margin-bottom:12px;display:flex;align-items:center;gap:8px;">
        <span style="font-size:16px;">✅</span>
        <div>
          <div style="font-size:13px;font-weight:500;color:#276749;">資料乾淨，無重複付款單</div>
          <div style="font-size:11px;color:#888;margin-top:2px;">已記錄 ${S.importedPayIds.size.toLocaleString()} 筆付款單號 · ${custsWithDetails} 位客戶有消費明細</div>
        </div>
      </div>`}

      <div style="padding:12px 14px;background:#F7F9FB;border-radius:10px;border:1px solid #e5e9ee;margin-bottom:12px;">
        <div style="font-size:13px;font-weight:600;color:#333;margin-bottom:4px;">依付款明細重算全部客戶</div>
        <div style="font-size:11px;color:#888;line-height:1.8;margin-bottom:10px;">
          以每位客戶的消費明細為唯一真相，重新計算<b>消費總額、付款筆數、首末消費日</b>，
          並<b>回推來源標籤</b>（門市／直播／直播+門市）。<br>
          來源標錯（例如線上客戶被標成門市）就按這顆。隨時可重複執行。
        </div>
        <button id="fix-all-btn" class="pbtn" style="font-size:12px;padding:6px 14px;">重算資料</button>
      </div>

      <button id="scan-btn" class="sbtn" style="font-size:12px;">重新掃描</button>
    </div>

    <!-- 來源批次修正 -->
    <div style="margin-top:1.8rem;border-top:1px solid #eee;padding-top:1.5rem;">
      <div style="font-size:13px;font-weight:600;color:#333;margin-bottom:6px;">來源批次修正</div>
      <div style="font-size:12px;color:#888;margin-bottom:10px;">把舊的來源標籤（FB、多管道等）一鍵更新為新標籤</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
        ${[["FB → 直播","FB","直播"],["直播+FB → 直播","直播+FB","直播"],["多管道 → 直播","多管道","直播"],["LINE → 直播","LINE","直播"],["IG → 直播","IG","直播"]].map(([label,from,to])=>`
        <button class="src-fix-btn" data-from="${from}" data-to="${to}"
          style="padding:5px 12px;border:1px solid #ddd;border-radius:6px;font-size:12px;cursor:pointer;background:#f8f8f8;color:#555;">
          ${label}
        </button>`).join("")}
      </div>
      <div style="font-size:11px;color:#bbb;">點擊後立即套用並同步，不可還原</div>
    </div>

    <!-- 備註人員修復 -->
    <div style="margin-top:1.8rem;border-top:1px solid #eee;padding-top:1.5rem;">
      <div style="font-size:13px;font-weight:600;color:#333;margin-bottom:6px;">備註人員修復</div>
      <div style="font-size:12px;color:#888;margin-bottom:10px;">若備註顯示「我」而非正確人名，可在此修復。請輸入原本操作那批備註的人名：</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input id="fix-who-from" class="inp" placeholder="要替換的名字（如：我）" style="width:150px;padding:6px 9px;font-size:13px;">
        <span style="color:#bbb;font-size:13px;">→</span>
        <input id="fix-who-to" class="inp" placeholder="正確人名（如：小雯）" style="width:150px;padding:6px 9px;font-size:13px;">
        <button id="fix-who-btn" class="pbtn" style="font-size:12px;padding:6px 14px;">修復</button>
      </div>
    </div>

    <!-- 危險操作 -->
    ${S.userRole==="admin" ? `
    <div style="margin-top:1.8rem;border-top:1px solid #eee;padding-top:1.5rem;">
      <div style="font-size:13px;font-weight:600;color:#333;margin-bottom:8px;">危險操作</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button id="reset-btn" style="padding:7px 14px;border:1px solid #E24B4A;border-radius:8px;font-size:13px;cursor:pointer;background:none;color:#E24B4A;font-family:inherit;">清空所有客戶資料</button>
        <button id="reset-pids-btn" style="padding:7px 14px;border:1px solid #E24B4A;border-radius:8px;font-size:13px;cursor:pointer;background:none;color:#E24B4A;font-family:inherit;">重置付款單記錄</button>
      </div>
    </div>` : ""}
  </div>`;
}

function renderDetail(c) {
  const payDetails = c.payDetails || {};
  const payList = Object.entries(payDetails)
    .map(([pid, pd]) => ({pid, ...pd}))
    .sort((a,b) => (b.date||"").localeCompare(a.date||""));
  const editing = S.editingDetail;
  const ef = S.editForm;

  return `<div style="width:330px;flex-shrink:0;border:1px solid #eee;border-radius:12px;background:#fff;padding:1.3rem;align-self:flex-start;max-height:90vh;overflow-y:auto;">

    <!-- 頂部：頭像 + 姓名 + 關閉 -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:10px;">
        ${av(c.name,0,42)}
        <div>
          <div style="font-size:15px;font-weight:600;color:#111;">${c.name}</div>
          <div style="margin-top:4px;">${gb(c.grade)}</div>
        </div>
      </div>
      <button id="cd" style="background:none;border:none;cursor:pointer;font-size:20px;color:#ccc;padding:2px;">✕</button>
    </div>

    <!-- 基本資料 -->
    <div style="margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div class="sec-hd" style="margin-bottom:0;">基本資料</div>
        ${editing
          ? `<div style="display:flex;gap:6px;">
               <button id="detail-save" data-id="${c.id}" style="padding:2px 9px;border:1px solid #3B6D11;border-radius:5px;font-size:11px;cursor:pointer;background:#EAF3DE;color:#3B6D11;">儲存</button>
               <button id="detail-cancel" style="padding:2px 9px;border:1px solid #ddd;border-radius:5px;font-size:11px;cursor:pointer;background:none;color:#888;">取消</button>
             </div>`
          : `<button id="detail-edit" data-id="${c.id}" style="padding:2px 9px;border:1px solid #ddd;border-radius:5px;font-size:11px;cursor:pointer;background:none;color:#888;">✏ 編輯</button>`
        }
      </div>

      ${editing ? `
        <!-- 編輯模式 -->
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div>
            <label style="font-size:11px;color:#888;display:block;margin-bottom:3px;">收件人</label>
            <input id="ef-name" class="inp" value="${ef.name||c.name}" style="width:100%;padding:6px 9px;font-size:13px;">
          </div>
          <div>
            <label style="font-size:11px;color:#888;display:block;margin-bottom:3px;">電話</label>
            <input id="ef-phone" class="inp" value="${ef.phone||c.phone||""}" style="width:100%;padding:6px 9px;font-size:13px;">
          </div>
          <div>
            <label style="font-size:11px;color:#888;display:block;margin-bottom:3px;">FB 帳號</label>
            <input id="ef-fb" class="inp" value="${ef.fb||c.fb||""}" style="width:100%;padding:6px 9px;font-size:13px;">
          </div>
          <div>
            <label style="font-size:11px;color:#888;display:block;margin-bottom:3px;">來源</label>
            <select id="ef-source" class="sel" style="width:100%;">
              ${[...new Set(["直播","門市","門市+直播","多管道","其他", ef.source||c.source||""].filter(Boolean))].map(s=>`<option value="${s}"${(ef.source||c.source)===s?" selected":""}>${s}</option>`).join("")}
            </select>
          </div>
          <div>
            <label style="font-size:11px;color:#888;display:block;margin-bottom:3px;">收件地址</label>
            <textarea id="ef-address" class="inp" style="width:100%;padding:6px 9px;font-size:13px;resize:vertical;min-height:60px;">${ef.address||c.address||""}</textarea>
          </div>
        </div>
      ` : `
        <!-- 顯示模式 -->
        <div class="kv"><span class="kv-k">收件人</span><span class="kv-v">${c.name}</span></div>
        <div class="kv"><span class="kv-k">電話</span><span class="kv-v">${c.phone||"—"}</span></div>
        <div class="kv"><span class="kv-k">FB 帳號</span><span class="kv-v" style="color:#185FA5;">${c.fb||"—"}</span></div>
        <div class="kv"><span class="kv-k">來源</span><span class="kv-v">${c.source}</span></div>
        ${c.address ? `<div class="kv" style="align-items:flex-start;"><span class="kv-k" style="flex-shrink:0;margin-top:1px;">收件地址</span><span class="kv-v" style="text-align:right;line-height:1.6;word-break:break-all;">${c.address}</span></div>` : ""}
      `}
    </div>

    <!-- 消費摘要 -->
    <div style="margin-bottom:14px;">
      <div class="sec-hd">消費摘要</div>
      ${[["消費總額",`NT$${Math.round(c.amount).toLocaleString()}`],["付款筆數",`${c.payments} 筆`],["首次消費",fmtD(c.firstDate)],["最後消費",fmtD(c.lastDate)]].map(([k,v])=>`<div class="kv"><span class="kv-k">${k}</span><span class="kv-v">${v}</span></div>`).join("")}
    </div>

    <!-- 消費明細流水帳 -->
    <div style="margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div class="sec-hd" style="margin-bottom:0;">消費流水帳${payList.length>0?` <span style="color:#185FA5;font-size:10px;text-transform:none;letter-spacing:0;">(${payList.length} 筆)</span>`:""}</div>
        ${payList.length>1 ? `<button id="expand-all" style="padding:2px 8px;border:1px solid #ddd;border-radius:5px;font-size:11px;cursor:pointer;background:none;color:#888;">全部展開</button>` : ""}
      </div>
      ${payList.length===0
        ? `<div style="background:#f8f8f8;border-radius:8px;padding:14px;text-align:center;">
             <div style="font-size:13px;color:#bbb;margin-bottom:4px;">尚無明細資料</div>
             <div style="font-size:11px;color:#ccc;">重新匯入 Excel（含商品名稱欄位）即可顯示完整流水帳</div>
           </div>`
        : `<div style="position:relative;">
            <!-- 時間軸線 -->
            <div style="position:absolute;left:11px;top:0;bottom:0;width:1px;background:#eee;"></div>
            ${payList.map((p,i)=>{
              const isOpen = S.expandedPays[p.pid] !== false; // 預設展開
              const hasItems = p.items && p.items.length > 0;
              const pidLabel = p.pid.startsWith("ord-")||p.pid.startsWith("i") ? `訂單 #${p.pid.slice(-4)}` : p.pid;
              return `
              <div style="position:relative;padding-left:28px;margin-bottom:12px;">
                <!-- 時間軸圓點 -->
                <div style="position:absolute;left:5px;top:8px;width:13px;height:13px;border-radius:50%;background:${i===0?"#185FA5":"#ddd"};border:2px solid #fff;box-shadow:0 0 0 1px ${i===0?"#185FA5":"#ddd"};"></div>

                <!-- 付款單卡片 -->
                <div style="border:1px solid #eee;border-radius:8px;overflow:hidden;background:#fff;">
                  <!-- 標頭：點擊展開/收合 -->
                  <div class="pay-toggle" data-pid="${p.pid}" style="padding:8px 10px;cursor:${hasItems||p.address?'pointer':'default'};display:flex;justify-content:space-between;align-items:center;background:${isOpen?'#fff':'#fafafa'};">
                    <div style="display:flex;flex-direction:column;gap:1px;">
                      <span style="font-size:12px;font-weight:600;color:#333;">${pidLabel}</span>
                      <span style="font-size:11px;color:#aaa;">${fmtD(p.date)}</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                      <span style="font-size:13px;font-weight:600;color:#185FA5;">NT$${Math.round(p.amount).toLocaleString()}</span>
                      ${hasItems||p.address ? `<span style="font-size:10px;color:#bbb;transition:transform .15s;display:inline-block;transform:rotate(${isOpen?'90':'0'}deg);">▶</span>` : ""}
                    </div>
                  </div>

                  <!-- 展開內容 -->
                  ${isOpen ? `
                  <div style="border-top:1px solid #f0f0f0;">
                    ${p.address ? `
                    <div style="padding:6px 10px;background:#fffef8;border-bottom:1px solid #f5f5f5;display:flex;gap:5px;align-items:flex-start;">
                      <span style="font-size:11px;color:#bbb;flex-shrink:0;margin-top:1px;">📦</span>
                      <span style="font-size:11px;color:#888;line-height:1.5;">${p.address}</span>
                    </div>` : ""}
                    ${hasItems ? `
                    <div style="padding:4px 10px 6px;">
                      ${p.items.map((item,ii)=>`
                      <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;${ii<p.items.length-1?'border-bottom:1px dashed #f5f5f5;':''}">
                        <span style="font-size:12px;color:#333;flex:1;padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.name}</span>
                        <div style="display:flex;gap:6px;flex-shrink:0;align-items:center;">
                          ${item.qty>1 ? `<span style="font-size:11px;color:#aaa;">×${item.qty}</span>` : ""}
                          <span style="font-size:12px;color:#555;">NT$${Math.round(item.amount || item.unitPrice*item.qty || 0).toLocaleString()}</span>
                        </div>
                      </div>`).join("")}
                    </div>` : `<div style="padding:8px 10px;font-size:12px;color:#ccc;">無商品明細</div>`}
                  </div>` : ""}
                </div>
              </div>`;
            }).join("")}
           </div>`
      }
    </div>

    <!-- 跟進狀態 -->
    <div style="margin-bottom:14px;">
      <div class="sec-hd">跟進狀態</div>
      ${[["負責人",c.staff||"未指派"],["狀態",c.status],["預定時間",c.callTime||"—"]].map(([k,v])=>`<div class="kv"><span class="kv-k">${k}</span><span class="kv-v">${v}</span></div>`).join("")}
    </div>

    <!-- 電訪記錄 -->
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div class="sec-hd" style="margin-bottom:0;">電訪記錄</div>
        <button id="dcb" data-name="${c.name}" style="padding:2px 8px;border:1px solid #185FA5;border-radius:5px;font-size:11px;cursor:pointer;background:none;color:#185FA5;">+ 指派</button>
      </div>
      ${c.notes.length===0
        ? `<div style="font-size:13px;color:#ddd;padding:4px 0;">尚無電訪記錄</div>`
        : c.notes.map((n,i)=>{
            const isEditing = S.editNote && S.editNote.callId===c.id && S.editNote.idx===i;
            return `<div class="note-box">
              ${isEditing ? `
                <textarea id="edit-note-txt" style="width:100%;padding:5px 7px;border:1px solid #ddd;border-radius:6px;font-size:12px;resize:vertical;min-height:55px;margin-bottom:6px;font-family:inherit;">${n.text||""}</textarea>
                <div style="display:flex;gap:5px;">
                  <button class="note-edit-save" data-id="${c.id}" data-idx="${i}" style="flex:1;padding:4px 8px;background:#111;color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer;">儲存</button>
                  <button class="note-edit-cancel" style="flex:1;padding:4px 8px;border:1px solid #ddd;border-radius:5px;font-size:11px;cursor:pointer;background:none;color:#888;">取消</button>
                </div>
              ` : `
                <div class="note-txt">${n.text}</div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
                  <span class="note-meta" style="margin-top:0;">${n.who||S.user} · ${n.date}</span>
                  <div style="display:flex;gap:4px;">
                    <button class="note-edit-btn" data-id="${c.id}" data-idx="${i}" data-text="${encodeURIComponent(n.text||"")}"
                      style="padding:2px 7px;border:1px solid #ddd;border-radius:4px;font-size:10px;cursor:pointer;background:none;color:#888;">✏</button>
                    <button class="note-del-btn" data-id="${c.id}" data-idx="${i}"
                      style="padding:2px 7px;border:1px solid #fcc;border-radius:4px;font-size:10px;cursor:pointer;background:none;color:#E24B4A;">✕</button>
                  </div>
                </div>
              `}
            </div>`;
          }).join("")}
      <div style="display:flex;gap:6px;margin-top:10px;">
        <input id="qn" class="inp" placeholder="新增備註..." value="${S.noteText}" style="flex:1;font-size:12px;padding:6px 9px;">
        <button id="sn" data-id="${c.id}" class="pbtn" style="padding:6px 11px;font-size:12px;">送出</button>
      </div>
    </div>
  </div>`;
}

function renderConfirmModal() {
  const cm = S.confirmModal;
  if (!cm) return "";
  return `<div class="overlay" style="z-index:300;">
  <div class="modal" style="max-width:380px;">
    <div style="font-size:22px;text-align:center;margin-bottom:12px;">⚠️</div>
    <div style="font-size:14px;font-weight:600;color:#111;text-align:center;margin-bottom:8px;">${cm.title||"確認操作"}</div>
    <div style="font-size:13px;color:#888;text-align:center;margin-bottom:1.5rem;line-height:1.7;">${cm.msg}</div>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button id="cm-cancel" class="sbtn" style="flex:1;padding:10px;">取消</button>
      <button id="cm-confirm" style="flex:1;padding:10px;background:#E24B4A;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;">${cm.confirmLabel||"確認"}</button>
    </div>
  </div></div>`;
}

function showConfirm(title, msg, confirmLabel, onConfirm) {
  S.confirmModal = { title, msg, confirmLabel, onConfirm };
  render();
}

function renderNoteModal() {
  const c = S.noteTarget; if (!c) return "";
  return `<div class="overlay">
  <div class="modal">
    <div style="font-size:16px;font-weight:700;color:#111;margin-bottom:4px;">完成電訪：${c.clientName||"客戶"}</div>
    <div style="font-size:12px;color:#888;margin-bottom:14px;">記錄本次重點，儲存後同步給所有夥伴</div>
    <textarea id="nt" class="inp" style="width:100%;resize:vertical;min-height:90px;margin-bottom:14px;" placeholder="例：客戶反應良好，有意加購保養組...">${S.noteText}</textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="nc2" class="sbtn">取消</button>
      <button id="ns" class="pbtn">標記完成並同步</button>
    </div>
  </div></div>`;
}

// ── Events ────────────────────────────────────────────────────────────
function bindEvents(pg,cl,cs,fl,tp) {
  const $ = id => document.getElementById(id);
  const on = (id,fn) => { const el=$(id); if(el) el.onclick=fn; };

  on("sw", () => logout());
  on("iq", () => { S.tab="import"; S.batchStep=0; S.fileQueue=[]; render(); });
  on("nc", () => { S.modal="call"; render(); });

  document.querySelectorAll(".tab-btn").forEach(b => b.onclick=()=>{ S.tab=b.dataset.tab; S.pg=0; render(); });

  // ── 拖曳區 ──
  const dz=$("dz"), fi=$("fi");
  if (dz && fi) {
    dz.onclick = e => { if(e.target!==fi) fi.click(); };
    fi.onchange = e => {
      if (e.target.files.length) {
        addFilesToQueue(e.target.files);
        render();
      }
    };
    dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave = () => dz.classList.remove("over");
    dz.ondrop = e => {
      e.preventDefault(); dz.classList.remove("over");
      if (e.dataTransfer.files.length) {
        addFilesToQueue(e.dataTransfer.files);
        render();
      }
    };
  }

  // ── 再加入檔案按鈕 ──
  const amf = $("add-more-files"), fi2 = $("fi2");
  if (amf && fi2) {
    amf.onclick = e => { e.stopPropagation(); fi2.click(); };
    fi2.onchange = e => {
      if (e.target.files.length) { addFilesToQueue(e.target.files); render(); }
    };
  }

  // ── 移除單一檔案 ──
  document.querySelectorAll(".rm-file").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const i = parseInt(b.dataset.i);
    S.fileQueue.splice(i, 1);
    if (S.fileQueue.length === 0) S.batchStep = 0;
    render();
  });

  // ── 欄位對應步驟 ──
  on("ib1", () => { S.batchStep=0; S.fileQueue=[]; S.hdrs=[]; render(); });
  document.querySelectorAll(".fsel").forEach(s => s.onchange=()=>{ S.fm[s.dataset.f]=s.value; });
  document.querySelectorAll(".src-pick").forEach(b => b.onclick=()=>{ S.importSource=b.dataset.src; render(); });
  on("start-import", () => {
    document.querySelectorAll(".fsel").forEach(s=>{ S.fm[s.dataset.f]=s.value; });
    runBatchImport();
  });

  // ── 完成後 ──
  on("go-clients", () => { S.tab="clients"; render(); });
  on("imp-again",  () => { S.batchStep=0; S.fileQueue=[]; S.hdrs=[]; S.batchStats=null; render(); });

  // ── 客戶名單篩選 ──
  const qs=$("qs"); if(qs) qs.oninput=()=>{ S.q=qs.value; S.pg=0; render(); };
  const fs=$("f-src");  if(fs)  fs.onchange=()=>{ S.fSrc=fs.value;   S.pg=0; render(); };
  const fg=$("f-grade"); if(fg) fg.onchange=()=>{ S.fGrade=fg.value; S.pg=0; render(); };
  const fst=$("f-status"); if(fst) fst.onchange=()=>{ S.fStatus=fst.value; S.pg=0; render(); };

  // 金額篩選 - 按搜索才觸發
  on("amt-search", ()=>{
    const mn=$("f-amt-min"); const mx=$("f-amt-max");
    S.fAmtMin=mn?mn.value:""; S.fAmtMax=mx?mx.value:"";
    S.pg=0; render();
  });
  const famn=$("f-amt-min"); if(famn) famn.onkeydown=e=>{ if(e.key==="Enter") document.getElementById("amt-search")?.click(); };
  const famx=$("f-amt-max"); if(famx) famx.onkeydown=e=>{ if(e.key==="Enter") document.getElementById("amt-search")?.click(); };
  on("clear-amt", ()=>{ S.fAmtMin=""; S.fAmtMax=""; S.pg=0; render(); });
  document.querySelectorAll(".amt-preset").forEach(b => b.onclick=()=>{
    // 再點一次同一個 → 取消
    if (S.fAmtMin===b.dataset.min && S.fAmtMax===b.dataset.max) {
      S.fAmtMin=""; S.fAmtMax="";
    } else {
      S.fAmtMin=b.dataset.min; S.fAmtMax=b.dataset.max;
    }
    S.pg=0; render();
  });
  on("pp", () => { S.pg=Math.max(0,S.pg-1);     render(); });
  on("pn", () => { S.pg=Math.min(tp-1,S.pg+1);  render(); });

  document.querySelectorAll(".sort-th").forEach(th => th.onclick=()=>{
    const col = th.dataset.col;
    if (S.sortCol===col) S.sortDir *= -1;
    else { S.sortCol=col; S.sortDir=-1; }
    S.pg=0; render();
  });
  document.querySelectorAll(".cr").forEach(r => r.onclick=e=>{
    if(e.target.closest("[data-stop]")) return;
    S.detail=r.dataset.id;
    S.editingDetail=false;
    S.editForm={};
    S.expandedPays={};
    render();
  });
  document.querySelectorAll(".cbn").forEach(b => b.onclick=e=>{ e.stopPropagation(); S.fc={...S.fc,client:b.dataset.name,staff:S.user||STAFF[0]}; S.modal="call"; render(); });

  // ── 電訪篩選 ──
  const cqs=$("cqs");  if(cqs)  cqs.oninput=()=>{ S.cq=cqs.value; render(); };
  const fcs=$("fcs");  if(fcs)  fcs.onchange=()=>{ S.fcSt=fcs.value;  render(); };
  const fcsf=$("fcsf"); if(fcsf) fcsf.onchange=()=>{ S.fcStf=fcsf.value; render(); };
  document.querySelectorAll(".dbn").forEach(b => b.onclick=e=>{ e.stopPropagation(); const c=cl.find(x=>x.id===b.dataset.id); S.noteTarget=c; S.noteText=""; S.modal="note"; render(); });
  document.querySelectorAll(".vbn").forEach(b => b.onclick=e=>{ e.stopPropagation(); S.selectedCall=b.dataset.id; render(); });

  // ── VIP 規則 ──
  on("sr", () => { const a=$("r-amt"),c=$("r-cnt"); if(a&&c){ S.rules={amt:parseInt(a.value)||5000,cnt:parseInt(c.value)||3}; savRules(); render(); } });
  on("scan-btn", () => render());
  // 來源批次修正
  document.querySelectorAll(".src-fix-btn").forEach(b => b.onclick = async () => {
    const from = b.dataset.from;
    const to   = b.dataset.to;
    let count = 0;
    S.custs.forEach(c => {
      if (c.source === from) { c.source = to; count++; }
    });
    if (count > 0) {
      await savCustomers();
      b.textContent = `✓ 已修正 ${count} 筆`;
      b.style.background = "#EAF3DE";
      b.style.color = "#3B6D11";
      b.style.borderColor = "#c6f6d5";
    } else {
      b.textContent = "無此來源";
      b.style.color = "#bbb";
    }
  });

  on("fix-who-btn", async () => {
    const from = document.getElementById("fix-who-from")?.value.trim();
    const to   = document.getElementById("fix-who-to")?.value.trim();
    if (!from || !to) return;
    let fixed = 0;
    Object.values(S.calls).forEach(cl => {
      (cl.notes||[]).forEach(n => {
        if (n.who === from) { n.who = to; fixed++; }
      });
      if (cl.staff === from) cl.staff = to;
    });
    if (fixed > 0) {
      await savCalls();
      showConfirm("修復完成", `已將 ${fixed} 筆備註的「${from}」更新為「${to}」`, "確認", ()=>{});
    } else {
      showConfirm("找不到資料", `沒有找到人名為「${from}」的備註`, "確認", ()=>{});
    }
    render();
  }); // 重新掃描就是重新 render
  const runRecalc = async () => {
    const n = await fixDuplicates();
    showConfirm(
      n > 0 ? "重算完成" : "資料正常",
      n > 0 ? `共修正 ${n} 位客戶的金額、付款筆數或來源標籤，資料已同步儲存。` : "資料已是最新狀態，無需修復。",
      "確認",
      () => {}
    );
    render();
  };
  on("fix-dup-btn", runRecalc);
  on("fix-all-btn", runRecalc);
  on("reset-pids-btn", () => {
    showConfirm(
      "重置付款單記錄",
      "重置後下次匯入將不會去重，適合需要重新建立所有資料的情況。",
      "確認重置",
      () => { S.importedPayIds=new Set(); saveImportedPayIds(); render(); }
    );
  });
  on("reset-btn", () => {
    showConfirm(
      "清空所有客戶資料",
      "將清除所有客戶、電訪記錄與付款單資料。\n此動作無法復原！",
      "確認清空",
      () => {
        S.custs=[]; S.calls={}; S.importedPayIds=new Set();
        savCustomers(); savCalls(); saveImportedPayIds();
        S.tab="import"; render();
      }
    );
  });

  // 確認 Modal 按鈕
  on("cm-cancel",  () => { S.confirmModal=null; render(); });
  on("cm-confirm", () => {
    const fn = S.confirmModal?.onConfirm;
    S.confirmModal = null;
    if (fn) fn();
  });

  // ── 詳情面板 ──
  // 消費流水帳展開/收合
  document.querySelectorAll(".pay-toggle").forEach(el => {
    el.onclick = () => {
      const pid = el.dataset.pid;
      // 預設展開，第一次點擊收合
      S.expandedPays[pid] = S.expandedPays[pid] === false ? true : false;
      render();
    };
  });
  const ea = document.getElementById("expand-all");
  if (ea) ea.onclick = () => {
    const dc2 = S.detail ? custs().find(c=>c.id===S.detail) : null;
    if (!dc2) return;
    const pays = Object.keys(dc2.payDetails||{});
    const allOpen = pays.every(pid => S.expandedPays[pid] !== false);
    pays.forEach(pid => { S.expandedPays[pid] = allOpen ? false : true; });
    render();
  };

  on("cd", () => { S.detail=null; S.noteText=""; S.editingDetail=false; S.editForm={}; render(); });

  // 基本資料編輯
  on("detail-edit", () => {
    const c = cs.find(x=>x.id===S.detail);
    if (!c) return;
    S.editingDetail = true;
    S.editForm = { name:c.name, phone:c.phone||"", fb:c.fb||"", source:c.source||"", address:c.address||"" };
    render();
  });
  on("detail-cancel", () => { S.editingDetail=false; S.editForm={}; render(); });
  on("detail-save", async () => {
    const id = document.getElementById("detail-save")?.dataset.id;
    if (!id) return;
    const idx = S.custs.findIndex(x=>x.id===id);
    if (idx === -1) return;
    // 讀取編輯表單值
    const newName    = document.getElementById("ef-name")?.value.trim() || S.custs[idx].name;
    const newPhone   = document.getElementById("ef-phone")?.value.trim() || "";
    const newFb      = document.getElementById("ef-fb")?.value.trim() || "";
    const newSource  = document.getElementById("ef-source")?.value || S.custs[idx].source;
    const newAddress = document.getElementById("ef-address")?.value.trim() || "";
    S.custs[idx] = { ...S.custs[idx], name:newName, phone:newPhone, fb:newFb, source:newSource, address:newAddress };
    // 同步 callMap 裡的 clientName
    Object.values(S.calls).forEach(cl => { if (cl.clientName === S.custs[idx].name || cl.clientName === newName) cl.clientName = newName; });
    S.editingDetail = false;
    S.editForm = {};
    await savCustomers();
    render();
  });
  on("dcb", () => { const b=$("dcb"); S.fc={...S.fc,client:b.dataset.name,staff:S.user||STAFF[0]}; S.modal="call"; S.detail=null; render(); });
  on("sn", async () => {
    const qn=$("qn"); if(!qn||!qn.value.trim()) return;
    const id=$("sn").dataset.id, ex=S.calls[id]||{};
    const who = ex.staff || S.user;
    const note={who, date:new Date().toLocaleDateString("zh-TW"), text:qn.value.trim()};
    const c=cs.find(x=>x.id===id);
    S.calls[id]={...ex, notes:[...(ex.notes||[]),note], clientName:c?.name||ex.clientName, grade:c?.grade||ex.grade, updatedAt:Date.now()};
    S.noteText=""; await savCalls(); render();
  });
  const qn=$("qn"); if(qn) qn.oninput=()=>{ S.noteText=qn.value; };

  // ── 電訪 Modal ──
  document.querySelectorAll(".sc").forEach(c => c.onclick=()=>{ S.fc.staff=c.dataset.s; render(); });

  // 新增人員
  on("add-staff-btn", async () => {
    const inp = document.getElementById("new-staff-inp");
    const name = inp?.value.trim();
    if (!name) return;
    if (S.staffList.includes(name)) { inp.value=""; return; }
    S.staffList.push(name);
    S.addStaffInput="";
    S.fc.staff = name;
    render();
    try { await saveStaffList(); }
    catch (e) { alert("無法儲存到 Firebase：" + (e?.message||e) + "\n\n請檢查 Firebase 規則是否允許寫入 crm/staffList"); console.error(e); }
  });
  const nsi = document.getElementById("new-staff-inp");
  if (nsi) {
    nsi.oninput = () => { S.addStaffInput = nsi.value; };
    nsi.onkeydown = e => { if(e.key==="Enter") document.getElementById("add-staff-btn")?.click(); };
  }

  // 移除人員
  document.querySelectorAll(".rm-staff").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const name = b.dataset.s;
    S.staffList = S.staffList.filter(s=>s!==name);
    if (S.fc.staff===name) S.fc.staff = S.staffList[0]||"";
    await saveStaffList();
    render();
  });

  // 電訪列表點選 → 流水帳
  document.querySelectorAll(".clr").forEach(r => r.onclick=e=>{
    if(e.target.closest("[data-stop]")) return;
    S.selectedCall = S.selectedCall===r.dataset.id ? null : r.dataset.id;
    render();
  });
  on("close-call-timeline", ()=>{ S.selectedCall=null; render(); });

  // 備註：點編輯按鈕 → 進入編輯模式
  document.querySelectorAll(".note-edit-btn").forEach(b => b.onclick = e => {
    e.stopPropagation();
    S.editNote = { callId: b.dataset.id, idx: parseInt(b.dataset.idx), text: decodeURIComponent(b.dataset.text||"") };
    render();
  });

  // 備註：取消編輯
  document.querySelectorAll(".note-edit-cancel").forEach(b => b.onclick = e => {
    e.stopPropagation();
    S.editNote = null; render();
  });

  // 備註：儲存編輯
  document.querySelectorAll(".note-edit-save").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const id = b.dataset.id;
    const idx = parseInt(b.dataset.idx);
    const newText = document.getElementById("edit-note-txt")?.value.trim();
    if (!newText) return;
    const ex = S.calls[id];
    if (!ex) return;
    const notes = [...(ex.notes||[])];
    notes[idx] = { ...notes[idx], text: newText, editedBy: S.user, editedAt: new Date().toLocaleDateString("zh-TW") };
    S.calls[id] = { ...ex, notes, updatedAt: Date.now() };
    S.editNote = null;
    await savCalls(); render();
  });

  // 備註：刪除
  document.querySelectorAll(".note-del-btn").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.id;
    const idx = parseInt(b.dataset.idx);
    showConfirm("刪除備註", "確定要刪除這筆備註嗎？", "刪除", async () => {
      const ex = S.calls[id];
      if (!ex) return;
      const notes = (ex.notes||[]).filter((_,i) => i!==idx);
      S.calls[id] = { ...ex, notes, updatedAt: Date.now() };
      await savCalls(); render();
    });
  });

  // 流水帳快速新增備註（只記錄備註，不更動負責人）
  on("call-add-note", async ()=>{
    const id = document.getElementById("call-add-note")?.dataset.id;
    const txt = document.getElementById("call-quick-note")?.value.trim();
    if (!id||!txt) return;
    const ex = S.calls[id]||{};
    const who = ex.staff || S.user;
    const note = {who, date:new Date().toLocaleDateString("zh-TW"), text:txt};
    S.calls[id] = {...ex, notes:[...(ex.notes||[]),note], updatedAt:Date.now()};
    await savCalls(); render();
  });

  // 流水帳直接完成電訪（只更新狀態，不改負責人）
  on("call-done-btn", async ()=>{
    const id = document.getElementById("call-done-btn")?.dataset.id;
    const txt = document.getElementById("call-quick-note")?.value.trim();
    if (!id) return;
    const ex = S.calls[id]||{};
    const who = ex.staff || S.user;
    const notes = txt ? [...(ex.notes||[]), {who, date:new Date().toLocaleDateString("zh-TW"), text:txt}] : (ex.notes||[]);
    S.calls[id] = {...ex, status:"已完成", notes, updatedAt:Date.now()};
    await savCalls(); render();
  });

  on("mc", () => { S.modal=null; render(); });
  on("ms", async () => {
    const cl=$("fc-c")?.value?.trim(); if(!cl) return;
    const t=$("fc-t")?.value||"", n=$("fc-n")?.value||"";
    const c=cs.find(x=>x.name===cl); if(!c){ alert("找不到此客戶，請確認姓名"); return; }
    const notes=n?[{who:S.fc.staff,date:new Date().toLocaleDateString("zh-TW"),text:n}]:[];
    S.calls[c.id]={...(S.calls[c.id]||{}),staff:S.fc.staff,status:"已指派",callTime:t,clientName:cl,grade:c.grade,notes:[...(S.calls[c.id]?.notes||[]),...notes],updatedAt:Date.now()};
    S.modal=null; S.fc={client:"",staff:S.user||STAFF[0],time:"",note:""};
    await savCalls(); render();
  });
  on("nc2", () => { S.modal=null; S.noteTarget=null; S.noteText=""; render(); });
  on("ns", async () => {
    const t=$("nt")?.value||"", c=S.noteTarget; if(!c) return;
    const who = (S.calls[c.id]?.staff) || c.staff || S.user;
    const note={who, date:new Date().toLocaleDateString("zh-TW"), text:t};
    S.calls[c.id]={...(S.calls[c.id]||c), status:"已完成", notes:[...(c.notes||[]),note], updatedAt:Date.now()};
    S.modal=null; S.noteTarget=null; S.noteText=""; await savCalls(); render();
  });
  const nt=$("nt"); if(nt) nt.oninput=()=>{ S.noteText=nt.value; };
}

// ── Init ─────────────────────────────────────────────────────────────
// 清掉舊版自製登入殘留
try { localStorage.removeItem("crm:session"); } catch(e) {}

initFirebase();
if (!useFirebase) {
  setTimeout(() => { if (S.setup) loadData(); }, 100);
  setInterval(() => { if (!S.setup||useFirebase||S.modal) return; loadData(); }, 15000);
}

// 從 sessionStorage 還原 Google 登入狀態
if (restoreSession()) loadData();

// bfcache 還原時重新驗證 session
window.addEventListener('pageshow', e => {
  if (e.persisted) {
    if (isSessionValid()) { if (!S.setup) { restoreSession(); loadData(); render(); } }
    else { logout(); }
  }
});

render();
</script>
</body>
</html>
